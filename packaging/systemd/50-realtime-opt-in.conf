# Experimental SCHED_FIFO service opt-in.
#
# This file is installed as documentation, not as an active systemd drop-in.
# Review the realtime policy and housekeeping CPU reservation first, then copy
# it to /etc/systemd/system/uperf-linux.service.d/50-realtime-opt-in.conf.
[Service]
RestrictRealtime=no
LimitRTPRIO=50
