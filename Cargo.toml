[workspace]
resolver = "3"
members = [
    "crates/uperf-core",
    "crates/uperf-platform",
    "crates/uperf-linux",
    "crates/uperf-actuator",
    "crates/uperf-api",
    "crates/uperf-daemon",
    "crates/uperfctl",
    "crates/uperf-probe",
    "crates/uperf-testkit",
    "crates/uperf-gui",
]
default-members = [
    "crates/uperf-daemon",
    "crates/uperfctl",
    "crates/uperf-probe",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-or-later"
repository = "https://github.com/EmberLuo/uperf-linux-rev"

[workspace.dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
crc32fast = "1.5.0"
evdev = "0.13.2"
futures-util = "0.3.32"
libc = "0.2.186"
regex = "1.12.4"
rustix = { version = "1.1.4", features = ["fs"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "rt", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["env-filter", "fmt", "json"] }
zbus = { version = "5.16.0", default-features = false, features = ["tokio"] }
zvariant = { version = "5.13.1", features = ["option-as-array"] }

# Size-oriented codegen for the shipped binaries. Keep unwind support so a
# supervised task panic can still drive orderly recovery, and leave stripping
# to the distribution packager so matching debug symbols can be produced.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "none"
panic = "unwind"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
